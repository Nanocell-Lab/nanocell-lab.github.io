# Software/toolkit map for MDOP-Labs.
# Updated: 2026-09-08
# Sources include official documentation/pages and the site's projects, theses, publications, and presentations.
- category: software-development
  label: Software Development
  tagline: Build reproducible lab tools, web apps, notebooks, and pipelines.
  focus: >
    This track supports the laboratory's software-oriented theses and presentations: Membrane Carromata, automated annotation systems, Snakemake workflows, pathology-AI pipelines, and reusable analysis apps.
  tools:
    - name: Git and GitHub
      url: https://git-scm.com/
      purpose: Version control and collaborative development for code, notebooks, websites, and reproducible analyses.
      start: Create one repository per tool, use issues for research tasks, and keep README-driven examples for students.
      tags: [version control, collaboration]
    - name: GitHub Actions
      url: https://docs.github.com/actions
      purpose: Continuous integration for testing, linting, data checks, and automatic site or documentation builds.
      start: Add a minimal workflow that validates YAML, runs unit tests, and builds documentation on every pull request.
      tags: [CI/CD, automation]
    - name: Python
      url: https://www.python.org/
      purpose: Core language for data science, automation, bioinformatics, machine learning, and structural analysis scripts.
      start: Standardize project templates with src/, notebooks/, tests/, environment files, and command-line entry points.
      tags: [programming, automation]
    - name: R and Bioconductor
      url: https://www.bioconductor.org/
      purpose: Statistical computing and genomics workflows for differential expression, annotation, enrichment, and visualization.
      start: Use R projects with renv or conda environments for reproducible omics analyses and report generation.
      tags: [statistics, genomics]
    - name: JupyterLab
      url: https://jupyter.org/
      purpose: Interactive notebooks for exploratory analysis, training, and transparent computational reports.
      start: Pair each notebook with a small test dataset and an exported HTML report for review.
      tags: [notebooks, training]
    - name: Streamlit
      url: https://docs.streamlit.io/
      purpose: Rapid Python web apps for interactive dashboards, screening reports, and student-facing data tools.
      start: Convert stable notebooks into small apps with file upload, cached preprocessing, and downloadable results.
      tags: [web app, dashboard]
    - name: Conda / Miniforge
      url: https://docs.conda.io/
      purpose: Cross-platform package and environment management for Python, R, bioinformatics, and molecular modeling tools.
      start: Maintain one environment.yml per project and export exact versions for thesis and publication reproducibility.
      tags: [environment, reproducibility]
    - name: Docker
      url: https://docs.docker.com/
      purpose: Containerize software, services, and analysis pipelines so they run consistently across laptops, servers, and cloud/HPC nodes.
      start: Add a Dockerfile for mature tools and document one command that reproduces the main analysis or app.
      tags: [containers, deployment]
    - name: Snakemake
      url: https://snakemake.readthedocs.io/
      purpose: Pythonic workflow system for scalable and reproducible data analyses.
      start: Use it for lab-scale workflows that start as scripts or notebooks and need traceable file-based execution.
      tags: [workflow, reproducibility]
    - name: Nextflow and nf-core
      url: https://www.nextflow.io/
      purpose: Portable, container-ready workflows for multi-sample omics pipelines across local, HPC, and cloud environments.
      start: Start with nf-core/rnaseq or nf-core/sarek, then wrap lab-specific postprocessing as versioned modules.
      tags: [workflow, HPC, omics]

- category: omics
  label: Omics
  tagline: Explore cancer genomics, single-cell/spatial biology, mitochondrial systems, and variant interpretation.
  focus: >
    This track reflects the laboratory's work on gastric, breast, prostate, melanoma, ovarian, colon, and hematological cancers; tumor microenvironment analysis; population-aware precision oncology; and environmental exposure signatures.
  tools:
    - name: MitoMatch
      url: https://mitomatch.web.app/
      purpose: Resource for functionalizing the mitochondrial proteome through predicted human mitochondrial protein-protein interactions.
      start: Use it to nominate mitochondrial interaction hypotheses for transporter, macrophage-metabolism, and cancer-metabolic-reprogramming projects.
      tags: [mitochondria, protein interactions]
    - name: Tabula Sapiens 2.0
      url: https://tabula-sapiens.sf.czbiohub.org/
      purpose: Human single-cell reference atlas for normal tissues, useful as a baseline for disease and tumor-microenvironment comparisons.
      start: Compare candidate genes or cell states from cancer datasets against normal tissue expression patterns.
      tags: [single-cell, reference atlas]
    - name: TISCH2
      url: https://tisch.compbio.cn/
      purpose: Tumor Immune Single-cell Hub for exploring tumor microenvironment expression across cancer scRNA-seq datasets.
      start: Query macrophage, myeloid, transporter, and immune-state markers before building Scanpy or Seurat analyses.
      tags: [single-cell, tumor microenvironment]
    - name: NCI Genomic Data Commons
      url: https://gdc.cancer.gov/
      purpose: Repository and computational platform for cancer genomic and clinical data, including TCGA-derived analyses.
      start: Pull harmonized cohorts for gastric, breast, prostate, ovarian, colon, and leukemia analyses before local modeling.
      tags: [cancer genomics, TCGA]
    - name: NCBI Gene Expression Omnibus
      url: https://www.ncbi.nlm.nih.gov/gds
      purpose: Public repository for high-throughput gene-expression and functional-genomics datasets.
      start: Mine exposure, cancer-cell-line, and validation cohorts for meta-analysis and reproducible reanalysis.
      tags: [transcriptomics, public data]
    - name: Scanpy
      url: https://scanpy.scverse.org/
      purpose: Scalable Python toolkit for preprocessing, clustering, visualization, trajectory analysis, and differential expression in single-cell data.
      start: Build a notebook template for TISCH2 or GEO scRNA-seq datasets using AnnData, QC plots, UMAPs, and marker scoring.
      tags: [single-cell, Python]
    - name: Seurat
      url: https://satijalab.org/seurat/
      purpose: R toolkit for QC, integration, analysis, and exploration of single-cell and multimodal data.
      start: Use it as the R reference workflow for students comparing cell states, datasets, and spatial/transcriptomic modalities.
      tags: [single-cell, R]
    - name: cBioPortal
      url: https://www.cbioportal.org/
      purpose: Interactive exploration, visualization, and download of large-scale cancer genomics datasets.
      start: Use it to rapidly inspect alterations, clinical associations, and cohort-level evidence before scripted analyses.
      tags: [cancer genomics, visualization]
    - name: Open Targets Platform
      url: https://platform.opentargets.org/
      purpose: Evidence integration for systematic drug-target identification and prioritization.
      start: Connect candidate genes from omics or structure projects to disease evidence, drugs, variants, and target-disease scores.
      tags: [target discovery, evidence]
    - name: OMIM
      url: https://www.omim.org/
      purpose: Curated compendium of human genes and genetic phenotypes for rare-disease and hereditary-cancer context.
      start: Use it to contextualize ACVR1, GLUT1/SLC2A1, TMC1, hereditary cancer genes, and genotype-phenotype hypotheses.
      tags: [human genetics, rare disease]
    - name: AlphaMissense
      url: https://alphamissense.hegelab.org/
      purpose: AI-based missense-variant effect predictions for prioritizing protein-changing variants.
      start: Treat scores as research prioritization evidence, not clinical classification, and combine them with ClinVar, population frequency, and structural modeling.
      tags: [variant interpretation, AI]
    - name: nf-core/rnaseq and nf-core/sarek
      url: https://nf-co.re/
      purpose: Community-curated Nextflow pipelines for RNA-seq and DNA-seq/germline-somatic variant workflows.
      start: Use standardized runs for AML transcriptomes, hereditary breast cancer panels, and reproducible NGS processing.
      tags: [pipelines, NGS]

- category: protein-structure
  label: Protein Structure
  tagline: Model proteins, mutations, complexes, ligands, membranes, and molecular dynamics mechanisms.
  focus: >
    This track supports the laboratory's structural work on GLUT transporters, ACVR1/TGF-β/BMP receptors, telomerase, MYC/NSD3S, peptide design, and pH-responsive or metabolism-linked drug discovery.
  tools:
    - name: RCSB Protein Data Bank
      url: https://www.rcsb.org/
      purpose: Curated experimental 3D structures for proteins, nucleic acids, ligands, and assemblies.
      start: Begin each structural project by collecting experimental templates, ligands, biological assemblies, and validation metadata.
      tags: [structures, templates]
    - name: AlphaFold Protein Structure Database
      url: https://alphafold.ebi.ac.uk/
      purpose: Large-scale access to predicted protein structures for human proteins and other organisms.
      start: Use predicted models when experimental structures are absent, then inspect confidence and domain boundaries before docking or simulation.
      tags: [predicted structures, AI]
    - name: Boltz-2
      url: https://github.com/jwohlwend/boltz
      purpose: Open biomolecular interaction model for predicting complex structures and binding affinities.
      start: Prioritize protein-ligand or protein-complex hypotheses before expensive docking, molecular dynamics, or experimental validation.
      tags: [AI structure, affinity]
    - name: CHARMM-GUI
      url: https://www.charmm-gui.org/
      purpose: Web platform for building reproducible biomolecular simulation systems, including membranes and protein assemblies.
      start: Generate membrane transporter systems for GLUT1, GLUT5, XylE, and hCAT-1 simulations with standardized inputs.
      tags: [system building, membranes]
    - name: OpenMM
      url: https://openmm.org/
      purpose: High-performance molecular simulation toolkit with Python bindings and GPU acceleration.
      start: Use it for teachable, scriptable simulations and custom analysis workflows linked to notebooks and GPU resources.
      tags: [molecular dynamics, GPU]
    - name: GROMACS
      url: https://www.gromacs.org/
      purpose: Molecular dynamics engine widely used for biomolecules, membranes, and coarse-grained/atomistic simulation workflows.
      start: Use it for production simulations where established force-field workflows, performance, and trajectory tools are needed.
      tags: [molecular dynamics, HPC]
    - name: AutoDock Vina
      url: https://autodock-vina.readthedocs.io/
      purpose: Open-source docking engine for protein-ligand docking and virtual screening.
      start: Benchmark each target with known ligands or controls before screening candidate inhibitors or modulators.
      tags: [docking, virtual screening]
    - name: RDKit
      url: https://www.rdkit.org/
      purpose: Open-source cheminformatics toolkit for molecular formats, descriptors, fingerprints, filtering, and library preparation.
      start: Prepare ligand libraries, remove duplicates, compute descriptors, and connect screening outputs to machine-learning models.
      tags: [cheminformatics, Python]
    - name: PLIP
      url: https://plip-tool.biotec.tu-dresden.de/plip-web/plip/index
      purpose: Protein-ligand interaction profiling for hydrogen bonds, hydrophobic contacts, salt bridges, and related contacts.
      start: Profile docked or simulated complexes to compare interaction persistence across mutations, pH states, or ligands.
      tags: [interactions, docking analysis]
    - name: UCSF ChimeraX
      url: https://www.cgl.ucsf.edu/chimerax/
      purpose: Molecular visualization and analysis for structures, maps, models, and publication-quality figures.
      start: Use it for structure inspection, figure generation, and teaching structural hypotheses before simulation setup.
      tags: [visualization, structures]
