    FONDECYT REGULAR No. 1260559
  role: >
    COINVESTIGADOR
  status: >
    EN EJECUCIÓN
  description: >
    Estudia cómo los cambios epigenéticos asociados al envejecimiento reprograman macrófagos del microambiente tumoral y modifican la progresión del cáncer, con foco en mecanismos celulares que puedan orientar nuevas hipótesis terapéuticas.

